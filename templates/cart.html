{% extends 'base.html' %}

{% block title %}Корзина - GAMING STORE{% endblock %}

{% block content %}
<h1>Корзина покупок</h1>

<div id="cart-content">
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <div id="cart-items">
                        <div class="text-center py-4">
                            <p class="text-muted">Корзина пуста</p>
                            <a href="/" class="btn btn-primary">Вернуться к покупкам</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Итого</h5>
                    <div id="cart-summary">
                        <p>Товары: <span id="total-items">0</span> шт.</p>
                        <p>Общая стоимость: <strong id="total-price">0</strong> RUB</p>
                        <hr>
                        <button id="checkout-btn" class="btn btn-success w-100" disabled>Оформить заказ</button>
                        <button id="clear-cart-btn" class="btn btn-outline-danger w-100 mt-2">Очистить корзину</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    function updateCartDisplay() {
        const items = cart.getItems();
        const cartItems = document.getElementById('cart-items');
        const totalItems = document.getElementById('total-items');
        const totalPrice = document.getElementById('total-price');
        const checkoutBtn = document.getElementById('checkout-btn');

        if (items.length === 0) {
            cartItems.innerHTML = `
                <div class="text-center py-4">
                    <p class="text-muted">Корзина пуста</p>
                    <a href="/" class="btn btn-primary">Вернуться к покупкам</a>
                </div>
            `;
            totalItems.textContent = '0';
            totalPrice.textContent = '0';
            checkoutBtn.disabled = true;
            return;
        }

        cartItems.innerHTML = items.map(item => `
            <div class="cart-item border-bottom pb-3 mb-3" data-item-id="${item.id}">
                <div class="row align-items-center">
                    <div class="col-8">
                        <h6 class="mb-1">${item.title}</h6>
                        <small class="text-muted">Продавец: ${item.seller.login}</small>
                        <p class="mb-0"><strong>${item.price} RUB</strong></p>
                    </div>
                    <div class="col-4">
                        <div class="input-group input-group-sm">
                            <button class="btn btn-outline-secondary decrease-quantity" type="button">-</button>
                            <input type="number" class="form-control text-center quantity-input" value="${item.quantity}" min="1">
                            <button class="btn btn-outline-secondary increase-quantity" type="button">+</button>
                        </div>
                        <button class="btn btn-danger btn-sm w-100 mt-2 remove-item">Удалить</button>
                    </div>
                </div>
            </div>
        `).join('');

        totalItems.textContent = items.reduce((sum, item) => sum + item.quantity, 0);
        totalPrice.textContent = cart.getTotalPrice().toFixed(2);
        checkoutBtn.disabled = false;

        addCartEventListeners();
    }

    function addCartEventListeners() {
        document.querySelectorAll('.remove-item').forEach(button => {
            button.addEventListener('click', function() {
                const itemId = this.closest('.cart-item').dataset.itemId;
                cart.removeItem(itemId);
                updateCartDisplay();
            });
        });
 
        document.querySelectorAll('.quantity-input').forEach(input => {
            input.addEventListener('change', function() {
                const itemId = this.closest('.cart-item').dataset.itemId;
                const quantity = parseInt(this.value) || 1;
                cart.updateQuantity(itemId, quantity);
                updateCartDisplay();
            });
        });

        document.querySelectorAll('.increase-quantity').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.parentElement.querySelector('.quantity-input');
                input.value = parseInt(input.value) + 1;
                input.dispatchEvent(new Event('change'));
            });
        });

        document.querySelectorAll('.decrease-quantity').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.parentElement.querySelector('.quantity-input');
                if (input.value > 1) {
                    input.value = parseInt(input.value) - 1;
                    input.dispatchEvent(new Event('change'));
                }
            });
        });
    }

    document.getElementById('clear-cart-btn').addEventListener('click', function() {
        if (confirm('Вы уверены, что хотите очистить корзину?')) {
            cart.clearCart();
            updateCartDisplay();
        }
    });


    document.getElementById('checkout-btn').addEventListener('click', function() {
        alert('Функция оформления заказа будет реализована позже!');
    });

    updateCartDisplay();
});
</script>
{% endblock %}
