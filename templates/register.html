{% extends 'base.html' %}

{% block title %}Регистрация - GAMING STORE{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Регистрация</h2>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="your@email.com">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" placeholder="Пароль">
                </div>
                
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Подтвердите пароль</label>
                    <input type="password" class="form-control" id="confirm_password" placeholder="Повторите пароль">
                </div>

                <button class="btn btn-primary w-100 py-2 mb-4">Зарегистрироваться</button>
                
                <div class="text-center">
                    <small class="text-muted">
                        Уже есть аккаунт? <a href="/login/" class="text-decoration-none">Войти</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
