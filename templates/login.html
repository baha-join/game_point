{% extends 'base.html' %}

{% block title %}Вход - GAMING STORE{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Вход или регистрация</h2>
                
                <div class="mb-4">
                    <div class="form-check mb-3 p-3 border rounded">
                        <input class="form-check-input" type="radio" name="loginMethod" id="vkLogin">
                        <label class="form-check-label w-100" for="vkLogin">
                            Войти с VK ID
                        </label>
                    </div>
                    <div class="form-check mb-3 p-3 border rounded">
                        <input class="form-check-input" type="radio" name="loginMethod" id="googleLogin">
                        <label class="form-check-label w-100" for="googleLogin">
                            Войти через Google
                        </label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Адрес электронной почты</label>
                    <input type="email" class="form-control" id="email" placeholder="your@email.com">
                </div>

                <button class="btn btn-primary w-100 py-2 mb-4" style="font-size: 16px;">Получить код</button>
                
                <div class="text-center">
                    <small class="text-muted">
                        Продолжая регистрацию или вход, вы принимаете условия 
                        <a href="#" class="text-decoration-none">Пользовательского соглашения</a> и 
                        <a href="#" class="text-decoration-none">Политики конфиденциальности</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
