<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GAMING STORE{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-gamepad me-2"></i>
                <strong>GAMING STORE</strong>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="/">
                        <i class="fas fa-home me-1"></i>Главная
                    </a>
                    <a class="nav-link" href="/all-games/">
                        <i class="fas fa-th-list me-1"></i>Каталог
                    </a>
                    <a class="nav-link" href="/sellers/">
                        <i class="fas fa-store me-1"></i>Продавцы
                    </a>
                    <a class="nav-link" href="/new/">
                        <i class="fas fa-star me-1"></i>Новинки
                    </a>
                    <a class="nav-link" href="/sale/">
                        <i class="fas fa-tag me-1"></i>Распродажа
                    </a>
                </div>
                
                <div class="d-flex align-items-center">
                    <form class="d-flex me-3" method="GET" action="/search/">
                        <input class="form-control me-2" type="search" name="q" placeholder="Поиск игр...">
                        <button class="btn btn-outline-light" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                    <a href="/cart/" class="btn btn-outline-light me-2">
                        <i class="fas fa-shopping-cart"></i>
                        Корзина
                    </a>
                    <a href="/login/" class="btn btn-outline-light">
                        <i class="fas fa-user"></i>
                        Войти
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-dark text-light mt-5 py-4">
        <div class="container text-center">
            <p>&copy; 2025 GAMING STORE. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
