{% extends 'base.html' %}

{% block title %}Продавцы - GAMING STORE{% endblock %}

{% block content %}
<h1>Все продавцы</h1>

<div class="row">
    {% for seller in sellers %}
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ seller.login }}</h5>
                <p class="card-text">Рейтинг: {{ seller.rating }}</p>
                <p class="card-text">Email: {{ seller.email }}</p>
                <p class="card-text">Телефон: {{ seller.phone_number }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
