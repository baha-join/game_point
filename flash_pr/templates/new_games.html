{% extends 'base.html' %}

{% block title %}Новинки - GAMING STORE{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Новые игры</h1>
    
    <div class="row">
        {% for game in games %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ game.title }}</h5>
                    <p class="card-text">{{ game.description|truncatewords:20 }}</p>
                    <p class="text-success"><strong>{{ game.price }} RUB</strong></p>
                    <span class="badge bg-danger">НОВИНКА</span>
                </div>
                <div class="card-footer">
                    <button class="btn btn-primary btn-sm">В корзину</button>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center">
            <div class="alert alert-warning">
                <h4>Новых игр пока нет</h4>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
